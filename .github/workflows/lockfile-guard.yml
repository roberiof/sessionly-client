name: Lockfile Guard

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  deny-npm-yarn-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if forbidden lockfiles exist
        run: |
          if [ -f package-lock.json ] || [ -f yarn.lock ]; then
            echo "Forbidden lockfile detected. Use pnpm-lock.yaml only."
            ls -1 package-lock.json yarn.lock 2>/dev/null || true
            exit 1
          fi
          echo "Lockfile policy OK."
